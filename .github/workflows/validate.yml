name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch HACS/Marketplace and hassfest rule changes between commits.
    - cron: "0 6 * * 1"

jobs:
  # Repository-level HACS/Marketplace validation, including the GitHub
  # description and topics the Marketplace list shows.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration

  # Home Assistant's own manifest and integration validation, required by the
  # Marketplace catalog.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  integration:
    name: integration (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest release tested; users who never upgraded still run it.
          - homeassistant: "2024.12.5"
            python: "3.12"
            plugin: "pytest-homeassistant-custom-component==0.13.195"
          # First release with the built-in Marketplace instead of HACS. From
          # 2026.11 the test plugin ships with core as pytest-homeassistant;
          # pytest-homeassistant-custom-component stops at 2026.10.
          - homeassistant: "2026.11.1"
            python: "3.14"
            plugin: "pytest-homeassistant==2026.11.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          uv pip install --system \
            "homeassistant==${{ matrix.homeassistant }}" \
            "pytest>=8" \
            "pytest-asyncio>=0.24" \
            "${{ matrix.plugin }}" \
            "ruff>=0.8" \
            "aioresponses>=0.7"
      - name: Ruff
        run: ruff check .
      - name: JSON manifests
        run: |
          python -m json.tool custom_components/mitipi_kevin/manifest.json > /dev/null
          python -m json.tool custom_components/mitipi_kevin/translations/en.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      - name: Kevin Presence card syntax
        run: node --check custom_components/mitipi_kevin/www/kevin-presence-card.js
      - name: Kevin Presence card registration smoke
        run: node tests/js/card_registration_smoke.mjs
      - name: Pytest
        run: pytest -q
