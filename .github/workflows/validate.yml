name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Repository metadata drifts rarely, so a weekly HACS check is enough.
    - cron: "0 6 * * 1"

jobs:
  # Repository-level HACS validation. It checks GitHub metadata (description,
  # topics) that cannot be changed from git, so running it on every push turns a
  # single outstanding metadata task into a failure notification per commit.
  # It runs on pull requests, on demand, and weekly instead.
  # Re-add `push` here once the repository description and topics are set.
  hacs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "homeassistant==2024.12.5" \
            "pytest>=8" \
            "pytest-asyncio>=0.24" \
            "pytest-homeassistant-custom-component==0.13.195" \
            "ruff>=0.8" \
            "aioresponses>=0.7"
      - name: Ruff
        run: ruff check .
      - name: JSON manifests
        run: |
          python -m json.tool custom_components/mitipi_kevin/manifest.json > /dev/null
          python -m json.tool custom_components/mitipi_kevin/translations/en.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      - name: Pytest
        run: pytest -q
