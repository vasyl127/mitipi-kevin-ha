image: python:3.12

pipelines:
  default:
    - step:
        name: Lint and test
        caches:
          - pip
        script:
          - pip install --upgrade pip
          - pip install "homeassistant==2024.12.5" "pytest>=8" "pytest-asyncio>=0.24" "pytest-homeassistant-custom-component==0.13.195" "ruff>=0.8" "aioresponses>=0.7"
          - ruff check .
          - pytest -q
